[workspace]
resolver = "2"
members = ["crates/phys-r", "crates/phys-r-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"

# Determinism note: integer overflow behaviour is made explicit in the fixed-point
# type (wrapping ops), so debug and release builds produce identical results.
[profile.dev]
opt-level = 1
